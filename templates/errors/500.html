{% extends "base.html" %}

{% block title %}500 Internal Error — ANTI-MATRIX{% endblock %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card text-center py-5">
    <div class="text-danger fs-1 mb-3"><i class="bi bi-exclamation-triangle-fill" style="font-size: 3.5rem;"></i></div>
    <h3 class="fw-bold text-white mb-2">500 Server Error</h3>
    <p class="text-muted small mb-4">
      An unexpected internal server error occurred. Active database transactions have been safely rolled back.
    </p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
      <i class="bi bi-arrow-clockwise me-1"></i>Return to Portal
    </a>
  </div>
</div>
{% endblock %}
