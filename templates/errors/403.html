{% extends "base.html" %}

{% block title %}403 Forbidden — ANTI-MATRIX{% endblock %}

{% block body %}
<div class="auth-wrapper">
  <div class="auth-card text-center py-5">
    <div class="text-warning fs-1 mb-3"><i class="bi bi-shield-x" style="font-size: 3.5rem;"></i></div>
    <h3 class="fw-bold text-white mb-2">403 Access Forbidden</h3>
    <p class="text-muted small mb-4">
      You do not possess the required authorization to view this resource.
      <br>Candidate accounts are restricted from administrative routes.
    </p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
      <i class="bi bi-arrow-left me-1"></i>Return to Portal
    </a>
  </div>
</div>
{% endblock %}
